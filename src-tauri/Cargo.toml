[package]
name = "app"
version = "0.1.2"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# `tauri::async_runtime` re-exports tokio's runtime/spawn/sync/task types, but
# not `tokio::time` -- needed directly (with the `time` feature) for the
# auto-sync timer's `tokio::time::sleep` in lib.rs's setup() closure.
tokio = { version = "1", features = ["time"] }
# The embedded-terminal feature (pty.rs): a real pseudo-terminal, cross-
# platform including Windows ConPTY. The wezterm project's own crate --
# built on directly with bespoke commands here, not a third-party Tauri
# terminal plugin, matching this codebase's own preference elsewhere this
# session for understanding exactly what's running over a heavier
# abstraction (see runClaudeSubprocess.ts's own doc comment on passing
# over the Claude Agent SDK for the same reason).
portable-pty = "0.8"
# PTY output is raw bytes, not guaranteed to be UTF-8-boundary-aligned
# per chunk (a multi-byte character or escape sequence can straddle two
# reads) -- base64-encoding each chunk before it crosses the Tauri
# event/JSON boundary avoids any lossy-UTF8 corruption at chunk edges;
# the frontend decodes it back to raw bytes before handing them to
# xterm.js, which -- like every other terminal-output consumer -- expects
# the real original bytes, not a re-encoded/lossy approximation of them.
base64 = "0.22"
